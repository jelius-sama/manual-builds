name: Compile on Amazon Linux 2023

on:
  push:
    branches: [ "main" ]
  # Allows you to trigger this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read the filename from payload.txt and append .sh
      - name: Get script filename from payload
        id: payload
        run: |
          BASE_NAME=$(cat payload.txt | tr -d '[:space:]')
          SCRIPT_FILE="${BASE_NAME}.sh"
          echo "Target script: $SCRIPT_FILE"
          echo "script_file=$SCRIPT_FILE" >> "$GITHUB_OUTPUT"

      # Create a dedicated directory to capture the compiled binaries
      - name: Prepare output directory
        run: mkdir -p output_binaries

      # Start the AL2023 container, mount the repo, and run the script
      - name: Execute script in AL2023
        run: |
          BASE_NAME=$(cat payload.txt | tr -d '[:space:]')
          docker run --rm \
            -e TARGET_REF="$BASE_NAME" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            amazonlinux:2023 \
            /bin/bash -c "
              chmod +x ${{ steps.payload.outputs.script_file }}
              ./${{ steps.payload.outputs.script_file }}
            "

      # Check if tag exists and setup release info
      - name: Prepare Release Info
        id: release_info
        run: |
          if [ ! -f output_binaries/release_tag.txt ]; then
            echo "No release_tag.txt found. Missing hash. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          TAG_NAME=$(cat output_binaries/release_tag.txt)
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          
          rm output_binaries/release_tag.txt
          
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME already exists. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG_NAME does not exist. Proceeding to release."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Pass the token so the gh CLI can authenticate
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create Release
      - name: Create GitHub Release
        if: steps.release_info.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          # Upload everything left in the output directory
          files: output_binaries/* 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
